# Kept deliberately quiet. Every pull request Dependabot opens runs the
# three-JDK matrix in `build.yml`, and this repository has already spent an
# Actions allowance once; ungrouped, three ecosystems at the default limit is
# fifteen open pull requests and forty-five jobs a week. Grouped, it is three.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      gradle:
        patterns: ["*"]

  # `smoke/` is a build of its own with its own settings file — it resolves the
  # published coordinates rather than the projects — so the root entry above
  # cannot see it.
  - package-ecosystem: "gradle"
    directory: "/smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      smoke:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
