name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain the modules compile against, so it is what the
        # published bytecode has to keep working on; 23 and 25 are what the repo
        # is developed and run on. Running all three is what catches "works on
        # my machine" before someone else finds it.
        java: ["21", "23", "25"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      # `build` does not run these, on purpose: a 40 ms target measured beside
      # eight modules' tests answers about the runner rather than the tool. A
      # step of their own is what keeps the wall-clock claims checked instead of
      # quietly dropped.
      - name: Wall-clock tests
        run: ./gradlew :examples:timingTests --stacktrace

      # A load generator's own suites assert on timing, so a failure here is
      # worth reading rather than guessing at — and a flake on a loaded runner
      # looks exactly like a regression until someone opens the report.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
