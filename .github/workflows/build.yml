name: build

# `main` rather than every branch. This repository opens a pull request as it
# creates a branch, so the `pull_request` event already builds every commit on
# one, and `["**"]` was building each of them a second time — six jobs for one
# commit where three answer the same question. `baseline.yml` has always been
# scoped this way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain the modules compile against, so it is what the
        # published bytecode has to keep working on; 23 and 25 are what the repo
        # is developed and run on. Running all three is what catches "works on
        # my machine" before someone else finds it.
        java: ["21", "23", "25"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      # `build` does not run these, on purpose: a 40 ms target measured beside
      # eight modules' tests answers about the runner rather than the tool. A
      # step of their own is what keeps the wall-clock claims checked instead of
      # quietly dropped.
      - name: Wall-clock tests
        run: ./gradlew :examples:timingTests --stacktrace

      # A load generator's own suites assert on timing, so a failure here is
      # worth reading rather than guessing at — and a flake on a loaded runner
      # looks exactly like a regression until someone opens the report.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The number the badge shows, published where a badge service can read it.
  #
  # `main` only: a pull request that moved the badge would show a number for code
  # nobody has merged. Separate from `build` because this one can write and that
  # matrix should not, and it holds no secrets either way.
  coverage-badge:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Measure
        run: ./gradlew coverageBadge

      # An orphan branch rather than a path on `main`. A job that commits to the
      # branch that triggered it either loops or leans on a `[skip ci]` convention
      # that one future edit forgets.
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(cat build/badges/coverage.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges --depth 1 2>/dev/null && git switch badges \
            || git switch --orphan badges
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p .
          printf '%s' "$number" > coverage.json
          git add coverage.json
          # Nothing to say where the number has not moved.
          git diff --cached --quiet && echo "coverage unchanged" && exit 0
          git commit -qm "coverage: $(python3 -c 'import json,sys;print(json.load(open("coverage.json"))["message"])')"
          git push origin badges

