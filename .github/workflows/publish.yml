name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Job-level rather than per-step: the credentials are the same for every
    # step that needs any of them.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the nearest `v` tag, and a shallow
          # checkout has no tags to derive it from.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The same gate a pull request goes through. A release that cannot build
      # is worth finding out about before it is on Maven Central for good,
      # which is why this runs the tests rather than skipping them.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Uploads a bundle to the Central Portal and leaves it staged. Releasing
      # it is a click there: a staged bundle can be dropped, a released one is
      # permanent. Set `mavenCentralAutomaticPublishing` to skip the click.
      - name: Publish the modules to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      # For anyone who wants neither a launcher nor a JDK. Only the server has a
      # distribution: `proofload-cli` has no `application` block, so it has no
      # start script to zip — from a shell it is a launcher or Maven Central.
      # The zip rather than the tar, and the zip rather than an uploaded
      # directory, because an artifact upload does not keep the executable bit
      # that `bin/proofload-mcp` needs.
      - name: Build the distribution
        run: ./gradlew :proofload-mcp:distZip

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: proofload-mcp/build/distributions/*.zip
          if-no-files-found: error

  # Separate from `publish` on purpose. That job holds the signing key and the
  # Central token and cannot write to this repository; this one can write and
  # holds neither. Keeping them apart is why a failed release has never been able
  # to do damage.
  release:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The only end-to-end check that the thing people download actually runs.
      # A distribution that cannot answer `initialize` is worth catching here
      # rather than in someone's client.
      - name: Start what is about to be published
        run: |
          unzip -q dist/*.zip -d unpacked
          answer=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | unpacked/*/bin/proofload-mcp)
          echo "$answer"
          case "$answer" in
            *'"protocolVersion"'*) ;;
            *) echo "the distribution did not answer initialize"; exit 1 ;;
          esac

      # A draft, for the same reason the Central bundle waits: nothing is public
      # until a person looks. `gh` is on the runner, so a release step needs no
      # third-party action.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-rc*|*-RC*|*-beta*|*-alpha*) prerelease="--prerelease" ;; esac
          # `--repo` because this job holds no checkout: it downloads the zip and
          # nothing else, and `gh` infers a repository from a git remote it has no
          # way to see here.
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "$GITHUB_REF_NAME" $prerelease

  # Also separate, and also holding none of the signing secrets: this one can
  # write packages and nothing else.
  image:
    needs: publish
    runs-on: ubuntu-latest

    # `contents: read` as well as the write it needs: naming any permission sets
    # every unnamed one to none, and a checkout of a private repository needs
    # read. The first run of this job found that out.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist

      # Where the Dockerfile expects `installDist` to have left it. Unzipped
      # rather than re-built with Gradle: unzip keeps the executable bit, and a
      # second Gradle build to produce bytes we already have is a second thing
      # that can differ.
      - name: Lay the distribution out
        run: |
          unzip -q dist/*.zip -d unpacked
          mkdir -p proofload-mcp/build/install
          mv unpacked/proofload-mcp-* proofload-mcp/build/install/proofload-mcp

      # Both architectures every time. An emulated JVM is slow enough to move a
      # measurement, and a release candidate nobody can run on an Apple Silicon
      # machine is one nobody tests.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${{ github.repository_owner }}/proofload-mcp"
          tags="--tag $image:$version"
          # No `latest` on a release candidate: whoever pulls the bare name
          # should get something that was meant for them.
          case "$GITHUB_REF_NAME" in
            *-rc*|*-RC*|*-beta*|*-alpha*) ;;
            *) tags="$tags --tag $image:latest" ;;
          esac
          docker buildx build proofload-mcp \
            --platform linux/amd64,linux/arm64 \
            $tags --push
