# detekt, layered on top of its default rule set (`buildUponDefaultConfig`).
# Only the deviations are written here, so this file reads as a list of
# decisions rather than a copy of somebody else's defaults.
#
# There is no free allowance to configure: detekt 2 fails the build on any
# finding, which is what the `maxIssues: 0` this file used to carry was for.
#
# Where a rule is off, the reason is beside it. A suppression with no reason is
# not a decision, and AGENTS.md says so.

comments:
  active: true
  UndocumentedPublicClass:
    active: false        # KDoc is prose here, and the reference manual carries the long form.
  UndocumentedPublicFunction:
    active: false

complexity:
  LongParameterList:
    # A DSL entry point takes the things it describes. Raise these only for a
    # shape that genuinely is a list; a settings bag belongs in a builder.
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerFile: 19
    allowedFunctionsPerClass: 19
    ignorePrivate: true
    ignoreOverridden: true
    ignoreDeprecated: true
  CyclomaticComplexMethod:
    allowedComplexity: 11
    # A `when` over a sealed hierarchy is one decision written out in full, and
    # the compiler checks it is complete. Splitting one to lower a count trades
    # that exhaustiveness for the metric.
    ignoreSimpleWhenEntries: true
  LongMethod:
    allowedLines: 79
  NestedBlockDepth:
    allowedDepth: 4

exceptions:
  TooGenericExceptionCaught:
    # Add a file here only for a genuine last line of defence — the one place
    # that turns an unexpected throwable into a reported result — and say which
    # in a comment. An empty list is the right starting point.
    #
    # Engine.kt runs a step body the caller wrote. A throw out of one is a
    # failed request to name and count, not a crash of the run; see the comment
    # on `attempt`.
    excludes: ['**/kestrel/engine/Engine.kt']
  SwallowedException:
    excludes: ['**/test/**']

naming:
  MatchingDeclarationName:
    # See .editorconfig: a file named for the idea it holds, rather than for
    # its first declaration, is the name a reader wants.
    active: false
  FunctionNaming:
    # Test names are sentences in backticks.
    excludes: ['**/test/**']

style:
  AbstractClassCanBeInterface:
    # A published sealed class carrying a default is ABI. Turning it into an
    # interface to save a keyword is a break; that trade should be made
    # deliberately, with a version bump, not by a lint rule.
    active: false
  UnusedImport:
    # The other half of the no-wildcard rule: an explicit import list is only
    # an inventory of what a file uses if the names it no longer uses are gone.
    # ktlint removes them on `spotlessApply`; this fails the build for one that
    # reached a commit anyway.
    active: true
  WildcardImport:
    # A project principle: an explicit import list is the one place a reader
    # sees where every name in a file comes from, and it is what keeps the
    # documentation's examples honest — each one names exactly what it needs.
    # `.editorconfig` tells ktlint and the IDE the same thing, so an
    # optimize-imports cannot put one back.
    active: true
  MagicNumber:
    # A number in a test is the assertion, not a value needing a name.
    excludes: ['**/test/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreNumbers: ['-1', '0', '1', '2']

  ReturnCount:
    # Four, for a lookup that answers as soon as it knows. Threading a nullable
    # through to a single exit does not make one clearer.
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Unfinished work does not belong on main.'
        value: 'TODO:'
      - reason: 'Unfinished work does not belong on main.'
        value: 'FIXME:'
  UnusedParameter:
    # `@ParameterizedTest(name = "{0}")` takes the case's label as its first
    # parameter and uses it for the name, not in the body.
    excludes: ['**/test/**']
  DestructuringDeclarationWithTooManyEntries:
    # A lambda destructuring what a DSL declared is as wide as the declaration.
    maxDestructuringEntries: 6

  # ---------------------------------------------------------------- functional
  #
  # The rules below are off in detekt's defaults and on here. They are what
  # "written functionally" is checkable as: a value once bound stays bound,
  # a function is an expression, and a lambda is not a place to hide a loop.
  ExpressionBodySyntax:
    active: true
    includeLineWrapping: false
  VarCouldBeVal:
    active: true
    ignoreLateinitVar: false
  UnnecessaryLet:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryFilter:
    active: true
  CollapsibleIfStatements:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  ForbiddenMethodCall:
    # A load generator that parks a thread to wait is measuring its own stalls.
    # Pacing belongs on a scheduler; `Thread.sleep` in library code is a bug in
    # waiting.
    active: true
    methods:
      - reason: 'Thread.sleep in library code turns a wait into a parked thread; schedule instead.'
        value: 'java.lang.Thread.sleep'
    # Tests sleep to make a gap they can measure.
    excludes: ['**/test/**']

# ------------------------------------------------------------- what is meant
#
# Rules whose default answer is right in general and wrong for one place here.
# Add an entry only after reading every site it fires at, and say why.

coroutines:
  InjectDispatcher:
    # Left on. A load generator's dispatchers are its whole behaviour under
    # load, so where one is chosen it is chosen deliberately and named — which
    # is what this rule asks for.
    active: true
